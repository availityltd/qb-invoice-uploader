<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier dashboard</title>
<link rel="stylesheet" href="/app.css">
<style>
  .cd-wrap{padding:18px 22px 60px;max-width:1240px}
  .cd-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .cd-head h1{margin:0;font-size:22px;font-weight:700;color:#0f2a43}
  .cd-head .sub{color:#6b7c8f;font-size:13px;margin-top:3px}
  .cd-dates{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cd-dates input[type=date]{border:1px solid #d5dde5;border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;color:#22384d;background:#fff}
  .cd-dates button{border:1px solid #d5dde5;background:#fff;border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;color:#22384d}
  .cd-dates button:hover{background:#f3f7fb}
  .cd-dates button.go{background:#0f7b4f;border-color:#0f7b4f;color:#fff;font-weight:600}
  .cd-quick{display:flex;gap:6px}
  .cd-quick b{font-weight:500}

  .cd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .cd-card{background:#fff;border:1px solid #e3e9ef;border-radius:11px;padding:14px 16px}
  .cd-card .k{font-size:12px;color:#6b7c8f;letter-spacing:.02em}
  .cd-card .v{font-size:22px;font-weight:700;color:#0f2a43;margin-top:5px;line-height:1.15}
  .cd-card .n{font-size:12px;color:#8a99a8;margin-top:3px}

  .cd-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:900px){.cd-row{grid-template-columns:1fr}}
  .cd-box{background:#fff;border:1px solid #e3e9ef;border-radius:11px;padding:15px 17px}
  .cd-box h2{margin:0 0 12px;font-size:14px;font-weight:700;color:#0f2a43}

  .cd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{border:1px solid #e7edf3;border-radius:9px;padding:11px 12px;background:#fafcfe}
  .tile .t{font-size:12px;color:#5d6f81;display:flex;align-items:center;gap:6px}
  .tile .t i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .tile .c{font-size:19px;font-weight:700;color:#0f2a43;margin-top:4px}
  .tile .a{font-size:12px;color:#8a99a8}

  table.cd{width:100%;border-collapse:collapse;font-size:13px}
  table.cd th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#7b8a99;border-bottom:1px solid #e7edf3;padding:7px 8px;font-weight:600}
  table.cd td{padding:8px;border-bottom:1px solid #f1f5f8;color:#2a3f54}
  table.cd td.r,table.cd th.r{text-align:right}
  table.cd tr:last-child td{border-bottom:0}

  .bars{display:flex;flex-direction:column;gap:7px}
  .bars .b{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:9px;font-size:12px;color:#2a3f54}
  .bars .track{background:#eef3f8;border-radius:4px;height:9px;overflow:hidden}
  .bars .fill{background:#2f7dd1;height:100%;border-radius:4px}

  .cd-note{font-size:12px;color:#8a99a8;margin-top:10px}
  .cd-msg{padding:14px;border-radius:9px;background:#fff5f5;border:1px solid #f2caca;color:#a13636;font-size:13px}
  .cd-load{color:#8a99a8;font-size:13px;padding:20px 0}
</style>
</head>
<body>
<div class="cd-wrap" id="wrap">
  <div class="cd-head">
    <div>
      <h1 id="ttl">Courier dashboard</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="cd-dates">
      <div class="cd-quick">
        <button data-days="0"><b>Today</b></button>
        <button data-days="6"><b>7 days</b></button>
        <button data-days="29"><b>30 days</b></button>
      </div>
      <input type="date" id="from">
      <input type="date" id="to">
      <button class="go" id="go">Show</button>
    </div>
  </div>
  <div id="body"><div class="cd-load">Loading…</div></div>
</div>

<script src="/nav.js"></script>
<script src="/nav-courier.js"></script>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var account = qs.get('account');
  var courier = qs.get('courier');

  var COLOR = {
    delivered:'#1f9d5a', returned:'#c9453f', returning:'#e08a2e', transit:'#2f7dd1',
    booked:'#6a6fd6', unbooked:'#8a99a8', cancelled:'#95a3b1', expired:'#b07a2e',
    review:'#c98b1e', transferred:'#4aa3c7', lost:'#8b2f2f', damaged:'#8b2f6b',
    other:'#b6c1cc'
  };
  var LABEL = {
    delivered:'Delivered', returned:'Returned', returning:'Out for return',
    transit:'In transit', booked:'Booked', unbooked:'Unbooked',
    cancelled:'Cancelled', expired:'Expired', review:'Under review',
    transferred:'Transferred', lost:'Lost', damaged:'Damaged', other:'Other'
  };
  var ORDER = ['delivered','transit','booked','returning','returned','review',
               'transferred','unbooked','cancelled','expired','lost','damaged','other'];

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function n0(v){return Number(v||0).toLocaleString('en-US');}
  function money(v){
    var x = Number(v||0);
    if(Math.abs(x) >= 1000000) return (x/1000000).toFixed(2)+'M';
    if(Math.abs(x) >= 1000)    return (x/1000).toFixed(1)+'K';
    return x.toFixed(0);
  }
  function full(v){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0});}
  function iso(d){return d.toISOString().slice(0,10);}
  function short(day){
    var p = String(day).split('-');
    return p[2]+'/'+p[1];
  }

  var fromEl = document.getElementById('from');
  var toEl   = document.getElementById('to');

  function setRange(days){
    var t = new Date();
    var f = new Date(); f.setDate(f.getDate() - days);
    fromEl.value = iso(f); toEl.value = iso(t);
  }

  var savedF = localStorage.getItem('cdFrom'), savedT = localStorage.getItem('cdTo');
  if(savedF && savedT){ fromEl.value = savedF; toEl.value = savedT; } else setRange(9);

  Array.prototype.forEach.call(document.querySelectorAll('.cd-quick button'), function(b){
    b.addEventListener('click', function(){ setRange(Number(b.dataset.days)); load(); });
  });
  document.getElementById('go').addEventListener('click', load);

  function scopeParams(){
    var p = new URLSearchParams();
    p.set('from', fromEl.value); p.set('to', toEl.value);
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    return p.toString();
  }

  function head(){
    var p = new URLSearchParams();
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    fetch('/api/courier/scope?'+p.toString(), {cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error) return;
        document.getElementById('ttl').textContent = d.title || 'Courier dashboard';
        var s = d.sub || '';
        if(d.lastSync) s += ' · last pulled ' + new Date(d.lastSync).toLocaleString();
        document.getElementById('sub').textContent = s;
      })
      .catch(function(){});
  }

  function load(){
    localStorage.setItem('cdFrom', fromEl.value);
    localStorage.setItem('cdTo', toEl.value);
    document.getElementById('body').innerHTML = '<div class="cd-load">Loading…</div>';
    fetch('/api/courier/stats?'+scopeParams(), {cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error){ document.getElementById('body').innerHTML = '<div class="cd-msg">'+esc(d.error)+'</div>'; return; }
        draw(d);
      })
      .catch(function(e){
        document.getElementById('body').innerHTML = '<div class="cd-msg">'+esc(e.message)+'</div>';
      });
  }

  function pick(groups, name){
    for(var i=0;i<groups.length;i++) if(groups[i].group === name) return groups[i];
    return {group:name, count:0, amount:0};
  }

  function donut(parts, centerTop, centerSub){
    var total = 0;
    parts.forEach(function(p){ total += p.value; });
    if(!total) return '<div class="cd-note">Nothing in this range.</div>';

    var R = 62, C = 2*Math.PI*R, off = 0, ring = '';
    parts.forEach(function(p){
      if(!p.value) return;
      var len = C * (p.value/total);
      ring += '<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="26" '+
              'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" '+
              'stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 80 80)"></circle>';
      off += len;
    });

    var legend = '';
    parts.forEach(function(p){
      if(!p.value) return;
      legend += '<div class="b"><span style="display:flex;align-items:center;gap:6px">'+
                '<i style="width:9px;height:9px;border-radius:50%;background:'+p.color+';display:inline-block"></i>'+
                esc(p.label)+'</span>'+
                '<span></span><span style="text-align:right">'+ (100*p.value/total).toFixed(1) +'%</span></div>';
    });

    return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">'+
             '<svg width="160" height="160" viewBox="0 0 160 160">'+ring+
               '<text x="80" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a43">'+esc(centerTop)+'</text>'+
               '<text x="80" y="95" text-anchor="middle" font-size="11" fill="#8a99a8">'+esc(centerSub)+'</text>'+
             '</svg>'+
             '<div class="bars" style="flex:1;min-width:150px">'+legend+'</div>'+
           '</div>';
  }

  function dailyChart(daily){
    if(!daily.length) return '<div class="cd-note">No days in this range.</div>';

    var W = 620, H = 210, PL = 44, PR = 12, PT = 12, PB = 28;
    var iw = W-PL-PR, ih = H-PT-PB;
    var max = 0;
    daily.forEach(function(d){ if(d.orders > max) max = d.orders; });
    if(!max) max = 1;

    var bw = iw/daily.length, g = Math.min(9, bw*0.28);
    var svg = '';

    for(var i=0;i<=4;i++){
      var y = PT + ih - (ih*i/4);
      svg += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#eef3f8"></line>';
      svg += '<text x="'+(PL-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9aa8b6">'+n0(Math.round(max*i/4))+'</text>';
    }

    daily.forEach(function(d, i){
      var x = PL + i*bw + g/2, w = bw - g;
      var ho = ih * (d.orders/max), hd = ih * (d.delivered/max);
      svg += '<rect x="'+x.toFixed(1)+'" y="'+(PT+ih-ho).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+ho.toFixed(1)+'" fill="#dbe7f4" rx="2"><title>'+esc(d.day)+' · '+n0(d.orders)+' orders</title></rect>';
      svg += '<rect x="'+x.toFixed(1)+'" y="'+(PT+ih-hd).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hd.toFixed(1)+'" fill="#1f9d5a" rx="2"><title>'+esc(d.day)+' · '+n0(d.delivered)+' delivered</title></rect>';
      if(daily.length <= 20 || i % 2 === 0){
        svg += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="#9aa8b6">'+esc(short(d.day))+'</text>';
      }
    });

    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+svg+'</svg>'+
           '<div class="cd-note"><span style="color:#2f7dd1">▉</span> booked &nbsp; <span style="color:#1f9d5a">▉</span> delivered</div>';
  }

  function draw(d){
    var t = d.totals || {}, groups = d.groups || [], accts = d.accounts || [],
        daily = d.daily || [], cities = d.cities || [];

    var delivered = pick(groups,'delivered'), returned = pick(groups,'returned'),
        returning = pick(groups,'returning'), transit = pick(groups,'transit'),
        booked = pick(groups,'booked'), unbooked = pick(groups,'unbooked');

    var closed = delivered.count + returned.count;
    var rate = closed ? (100*delivered.count/closed) : 0;

    var html = '';

    html += '<div class="cd-cards">';
    html += card('Orders', n0(t.orders), 'booked in this range');
    html += card('Order value', full(t.amount), 'PKR');
    html += card('Delivered value', full(delivered.amount), n0(delivered.count)+' orders');
    html += card('Delivery rate', rate.toFixed(1)+'%', 'of settled orders');
    html += card('Courier fee', full(t.fee), 'plus tax '+full(t.tax));
    html += '</div>';

    html += '<div class="cd-row">';

    html += '<div class="cd-box"><h2>Where the orders stand</h2>'+
            donut([
              {label:'Delivered', value:delivered.count, color:COLOR.delivered},
              {label:'Returned',  value:returned.count,  color:COLOR.returned},
              {label:'Out for return', value:returning.count, color:COLOR.returning},
              {label:'In transit', value:transit.count, color:COLOR.transit},
              {label:'Booked', value:booked.count, color:COLOR.booked},
              {label:'Unbooked', value:unbooked.count, color:COLOR.unbooked}
            ], rate.toFixed(0)+'%', 'delivered')+'</div>';

    var tiles = '';
    ORDER.forEach(function(k){
      var g = pick(groups, k);
      if(!g.count) return;
      tiles += '<div class="tile"><div class="t"><i style="background:'+(COLOR[k]||'#b6c1cc')+'"></i>'+esc(LABEL[k]||k)+'</div>'+
               '<div class="c">'+n0(g.count)+'</div>'+
               '<div class="a">'+money(g.amount)+'</div></div>';
    });
    html += '<div class="cd-box"><h2>Every status</h2><div class="cd-tiles">'+(tiles||'<div class="cd-note">Nothing yet.</div>')+'</div></div>';

    html += '</div>';

    html += '<div class="cd-box" style="margin-bottom:16px"><h2>Day by day</h2>'+dailyChart(daily)+'</div>';

    html += '<div class="cd-row">';

    var rows = '';
    accts.forEach(function(a){
      var cl = a.delivered + a.returned;
      var r = cl ? (100*a.delivered/cl) : 0;
      rows += '<tr><td><a href="/courier-dash.html?account='+a.id+'" style="color:#2f7dd1;text-decoration:none">'+esc(a.label)+'</a></td>'+
              '<td class="r">'+n0(a.orders)+'</td>'+
              '<td class="r">'+n0(a.delivered)+'</td>'+
              '<td class="r">'+n0(a.returned)+'</td>'+
              '<td class="r">'+r.toFixed(1)+'%</td>'+
              '<td class="r">'+money(a.deliveredAmount)+'</td></tr>';
    });
    html += '<div class="cd-box"><h2>Accounts</h2><table class="cd">'+
            '<tr><th>Account</th><th class="r">Orders</th><th class="r">Delivered</th><th class="r">Returned</th><th class="r">Rate</th><th class="r">Delivered value</th></tr>'+
            (rows || '<tr><td colspan="6" style="color:#8a99a8">No accounts.</td></tr>')+'</table></div>';

    var cmax = 0;
    cities.forEach(function(c){ if(c.count > cmax) cmax = c.count; });
    var cb = '';
    cities.forEach(function(c){
      cb += '<div class="b"><span>'+esc(c.city)+'</span>'+
            '<span class="track"><span class="fill" style="width:'+(cmax?100*c.count/cmax:0).toFixed(1)+'%"></span></span>'+
            '<span style="text-align:right">'+n0(c.count)+'</span></div>';
    });
    html += '<div class="cd-box"><h2>Busiest cities</h2><div class="bars">'+(cb||'<div class="cd-note">No cities.</div>')+'</div></div>';

    html += '</div>';

    if(t.lastSeen){
      html += '<div class="cd-note">Newest order in the store: '+esc(new Date(t.lastSeen).toLocaleString())+'</div>';
    }

    document.getElementById('body').innerHTML = html;
  }

  function card(k, v, n){
    return '<div class="cd-card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="n">'+esc(n)+'</div></div>';
  }

  head();
  load();
})();
</script>
</body>
</html>
