<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery charges</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F2E24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .step{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:20px 24px;margin-bottom:16px}
  .step h2{margin:0 0 4px;font-size:14.5px;font-weight:600}
  .step .hint{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
  .step.done{border-color:var(--qbo)}

  .picks{display:flex;flex-wrap:wrap;gap:8px}
  .pick{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 14px;
    cursor:pointer;font-size:13px;font-family:inherit;transition:.13s;text-align:left}
  .pick:hover{border-color:var(--qbo)}
  .pick.on{border-color:var(--qbo);background:#F2FAF0;font-weight:600}
  .pick small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}

  .crumb{font-size:12px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)}
  .crumb b{color:var(--text)}

  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .cols label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);margin-bottom:4px}

  .colnow{border:1px solid var(--line);background:var(--tint);border-radius:8px;
    padding:12px 15px;margin-bottom:14px;font-size:12.5px;line-height:1.9}
  .colnow b{font-family:var(--mono);font-weight:500}
  .colnow .miss{color:var(--warn);font-weight:600}
  .colnow a{margin-left:8px;font-size:12px}

  .cprs{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}
  .cprCard{border:1px solid var(--line);background:#fff;border-radius:8px;
    min-width:200px;max-width:330px;overflow:hidden;cursor:pointer;transition:.13s}
  .cprCard:hover{border-color:var(--qbo)}
  .cprCard.on{box-shadow:0 0 0 2px var(--qbo)}
  .cprCard.done{border-color:var(--qbo);background:#F2FAF0}
  .cprCard.off{border-color:var(--warn);background:#FFFBF0}
  .cprCard .warnmark{color:var(--warn);font-weight:700;margin-right:4px}
  .cprCard .head{padding:10px 14px;font-size:13px}
  .cprCard .head b{font-weight:600;display:block}
  .cprCard .head small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .cprCard .tick{color:var(--qbo);font-weight:700;margin-right:4px}

  .entry{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;
    margin:16px 0}
  .entry table{width:100%;border-collapse:collapse;font-size:13px}
  .entry th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line);
    background:var(--tint)}
  .entry td{padding:9px 14px;border-bottom:1px solid var(--line)}
  .entry td.num{text-align:right;font-family:var(--mono)}
  .entry tr.tot td{font-weight:600;border-bottom:none;background:var(--tint)}
  .entry select{font-size:12.5px;padding:5px 8px;margin:0;width:100%}
  .entry input.accfind{font-size:12.5px;padding:5px 8px;margin:0;width:100%}
  .entry input.amt{font-size:12.5px;padding:5px 8px;margin:0;text-align:right;
    font-family:var(--mono);width:120px}
  .entry #jDesc, .entry #jMemo{width:100%;font-size:12.5px;padding:6px 9px;margin:0}
  .entry td .made{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;
    line-height:1.5}

  /* the line builder, for couriers that write a summary block */
  .lineset{display:flex;flex-direction:column;gap:12px}
  .lineRow{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px 16px}
  .lineRow .top{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;
    align-items:end;margin-bottom:12px}
  .lineRow label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);margin-bottom:4px}
  .lineRow input, .lineRow select{margin:0;font-size:12.5px;padding:6px 9px;width:100%}
  .lineRow .drop{font-size:11.5px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);
    background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .lineRow .drop:hover{border-color:var(--bad);color:var(--bad)}
  .chargeGrid{display:flex;flex-wrap:wrap;gap:7px}
  .chargeGrid label{display:flex;align-items:center;gap:6px;font-size:12px;
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;
    text-transform:none;letter-spacing:0;color:var(--text);margin:0}
  .chargeGrid label:hover{border-color:var(--qbo)}
  .chargeGrid label.on{border-color:var(--qbo);background:#F2FAF0;font-weight:600}
  .chargeGrid label.roll{color:var(--muted);border-style:dashed}
    .chargeGrid label.minus{border-color:var(--warn);background:#FFFBF0}
  .chargeGrid .flip{margin-left:6px;border:1px solid var(--line);background:#fff;
    border-radius:4px;width:20px;height:20px;line-height:1;cursor:pointer;
    font-family:var(--mono);font-size:12px;padding:0}
  .chargeGrid .flip:hover{border-color:var(--qbo)}
  .chargeGrid input{width:auto;margin:0}

  .result{border:1px solid var(--line);border-radius:8px;padding:12px 15px;margin-top:12px;
    background:#fff;font-size:13px}
  .result.good{border-color:var(--qbo);background:#F2FAF0}
  .result.bad{border-color:var(--bad);background:#FDF3F3}
  .result.warn{border-color:var(--warn);background:#FFFBF0}
</style>
</head>
<body>

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1>Delivery charges</h1>
        <div class="sub">Post what the courier kept back as a journal entry in QuickBooks.</div>
      </div>
    </div>

    <div class="shell">

      <div id="gate" class="gate hide">
        <img src="/logo.svg" alt="">
        <h2>Connect your QuickBooks company</h2>
        <p>Nothing is posted until you have seen the entry.</p>
        <button class="solid" id="btnConnect">Connect to QuickBooks</button>
      </div>

      <div id="body" class="hide">

               <div class="step hide" id="stepBrowse">
          <h2>Pick the sheet</h2>
          <div class="hint" id="whichFolder"></div>
          <div class="crumb" id="crumb"></div>
          <div class="picks" id="browse"></div>
        </div>

        <!-- couriers whose charges sit in columns -->
        <div class="step hide" id="stepCols">
          <h2>Columns</h2>
          <div class="hint" id="colsHint"></div>
          <div class="cols" id="colsBox"></div>
          <div style="margin-top:14px">
            <button class="solid" id="btnCols" data-need="charges">Save and continue</button>
          </div>
        </div>

        <!-- couriers who write a summary block instead -->
        <div class="step hide" id="stepLines">
          <h2>How the entry is built</h2>
          <div class="hint" id="linesHint"></div>
          <div class="lineset" id="lineSet"></div>
          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="solid" id="btnLines" data-need="charges">Save and continue</button>
            <button class="mini" id="btnAddLine" style="font-size:12px;padding:8px 14px;
              border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;
              font-family:inherit">+ Add another line</button>
          </div>
        </div>

        <div class="step hide" id="stepCpr">
          <h2>CPRs in this sheet</h2>
          <div class="colnow" id="colNow"></div>
          <div class="hint" id="cprHint"></div>
          <div class="cprs" id="cprList"></div>
        </div>

        <div class="step hide" id="stepEntry">
          <h2>The journal entry</h2>
          <div class="hint" id="entryHint"></div>
          <div id="warnBox"></div>
          <div class="entry" id="entryBox"></div>
          <button class="solid" id="btnPost" data-need="charges">Post to QuickBooks</button>
          <div id="postOut"></div>
        </div>

        <div class="stat" id="statBox"></div>
      </div>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var S = {
        root: '', dcRoot: '', which: 'cpr', courier: '', trail: [],
    sheetId: '', excel: false, tab: '',
    mode: 'columns',                 // or 'summary'
    header: [], cols: null, cprs: [],
    names: [], lines: [],
    accounts: null, qbAccounts: [],
    current: null, preview: null,
    posted: {}, existing: {}, scanning: false
  };
  // a charge may be a plain name or a name with a sign
  function chargeName(c){
    return typeof c === 'string' ? c : (c && c.name) || '';
  }
  function money(n){
    var v = Number(n || 0);
    var p = Math.abs(v).toFixed(2).split('.');
    return (v < 0 ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
  }
  function nf(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function say(cls, html){
    $('statBox').className = 'stat' + (cls ? ' ' + cls : '');
    $('statBox').innerHTML = html;
  }
  function clearSay(){ $('statBox').className = 'stat'; $('statBox').textContent = ''; }

  function get(url){
    return fetch(url, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){
      if(d.error) throw new Error(d.error);
      return d;
    });
  }
  function post(url, body){
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function(r){
      return r.json().then(function(d){
        if(d.error){ var e = new Error(d.error); e.data = d; throw e; }
        return d;
      });
    });
  }

  /* ---------- start ---------- */

  $('btnConnect').addEventListener('click', function(){ location.href = '/auth/connect'; });

  window.APP.ready.then(function(s){
    if(!s.connected){ $('gate').classList.remove('hide'); return; }
    $('body').classList.remove('hide');

    get('/api/charges/qb-accounts')
      .then(function(d){ S.qbAccounts = d.accounts || []; })
      .catch(function(){});

        Promise.all([
      get('/api/cpr/root').catch(function(){ return {}; }),
      get('/api/charges/dc-root').catch(function(){ return {}; })
    ]).then(function(both){
      S.root = both[0].folderId || '';
      S.dcRoot = both[1].folderId || '';
      if(!S.root){
        say('bad', '<b>Set the CPR folder on the Receive payments page first.</b>');
        return;
      }
      openCouriers();
    });
  });

  /* ---------- browsing ---------- */

  function hideFrom(step){
    var order = ['stepBrowse','stepCols','stepLines','stepCpr','stepEntry'];
    var i = order.indexOf(step);
    order.slice(i).forEach(function(id){ $(id).classList.add('hide'); });
  }

  function drawCrumb(){
    var bits = ['Root'];
    S.trail.forEach(function(t){ bits.push(t.name); });
    $('crumb').innerHTML = bits.map(function(b, i){
      return i === bits.length - 1 ? '<b>' + esc(b) + '</b>' : esc(b);
    }).join(' / ');
  }

    function openCouriers(){
    hideFrom('stepBrowse');
    S.trail = [];
    $('stepBrowse').classList.remove('hide');
    drawWhich();
    drawCrumb();
    $('browse').innerHTML = '<span style="font-size:13px;color:var(--muted)">Reading Drive...</span>';

    var url = S.which === 'dc'
      ? '/api/void/sheets?id=' + encodeURIComponent(S.dcRoot)
      : '/api/cpr/couriers';

    get(url).then(function(d){
      var folders = d.folders || [];
      var sheets = d.sheets || [];

      if(!folders.length && !sheets.length){
        $('browse').innerHTML = '<span style="font-size:13px;color:var(--muted)">' +
          'Nothing in that folder.</span>';
        return;
      }

      paint(folders, sheets, function(f){
        if(S.which !== 'dc') S.courier = f.name;
        openFolder(f);
      }, openSheet);
    }).catch(function(e){
      $('browse').innerHTML = '';
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  }

  // two folders live here: the CPR sheets, and Daewoo's delivery charge sheets
  function drawWhich(){
    var box = $('whichFolder');
    box.innerHTML =
      '<button class="pick' + (S.which === 'cpr' ? ' on' : '') + '" id="wCpr" ' +
        'style="margin-right:8px">CPR sheets</button>' +
      '<button class="pick' + (S.which === 'dc' ? ' on' : '') + '" id="wDc">' +
        'Delivery charge sheets</button>' +
      '<a href="#" id="setDc" style="margin-left:12px;font-size:12px">' +
        (S.dcRoot ? 'change that folder' : 'set the folder') + '</a>';

    $('wCpr').addEventListener('click', function(){
      S.which = 'cpr';
      S.courier = '';
      openCouriers();
    });

    $('wDc').addEventListener('click', function(){
      if(!S.dcRoot){ askDcFolder(); return; }
      S.which = 'dc';
      S.courier = S.courier || 'Daewoo delivery charges';
      openCouriers();
    });

    $('setDc').addEventListener('click', function(e){
      e.preventDefault();
      askDcFolder();
    });
  }

  function askDcFolder(){
    var v = prompt('Paste the link to the folder holding the delivery charge sheets:',
                   S.dcRoot || '');
    if(v === null) return;
    v = v.trim();
    if(!v) return;

    post('/api/charges/dc-root', { folderId: v }).then(function(d){
      S.dcRoot = d.folderId;
      S.which = 'dc';
      S.courier = S.courier || 'Daewoo delivery charges';
      openCouriers();
    }).catch(function(e){
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  }

  function openFolder(folder){
    hideFrom('stepCols');
    S.trail.push(folder);
    drawCrumb();
    $('browse').innerHTML = '<span style="font-size:13px;color:var(--muted)">Reading...</span>';

       var u = S.which === 'dc'
      ? '/api/void/sheets?id=' + encodeURIComponent(folder.id)
      : '/api/cpr/folder?id=' + encodeURIComponent(folder.id);

    get(u).then(function(d){
      if(!d.folders.length && !d.sheets.length){
        $('browse').innerHTML = '<span style="font-size:13px;color:var(--muted)">Nothing in there. ' +
          '<a href="#" id="back">Go back</a></span>';
        $('back').addEventListener('click', function(e){ e.preventDefault(); goBack(); });
        return;
      }
      paint(d.folders, d.sheets, openFolder, openSheet);
    }).catch(function(e){
      $('browse').innerHTML = '';
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  }

  function goBack(){
    S.trail.pop();
    if(!S.trail.length){ openCouriers(); return; }
    var last = S.trail.pop();
    openFolder(last);
  }

  function paint(folders, sheets, onFolder, onSheet){
    var box = $('browse');
    box.innerHTML = '';

    if(S.trail.length){
      var b = document.createElement('button');
      b.className = 'pick';
      b.textContent = '\u2190 Back';
      b.addEventListener('click', goBack);
      box.appendChild(b);
    }

    folders.forEach(function(f){
      var e = document.createElement('button');
      e.className = 'pick';
      e.textContent = '\u{1F4C1} ' + f.name;
      e.addEventListener('click', function(){ onFolder(f); });
      box.appendChild(e);
    });

    (sheets || []).forEach(function(f){
      var e = document.createElement('button');
      e.className = 'pick';
      e.innerHTML = '\u{1F4C4} ' + esc(f.name) +
        (f.excel ? '<small>Excel file</small>' : '<small>Google Sheet</small>');
      e.addEventListener('click', function(){
        Array.prototype.forEach.call(box.children, function(c){ c.classList.remove('on'); });
        e.classList.add('on');
        onSheet(f);
      });
      box.appendChild(e);
    });
  }

  /* ---------- opening a sheet: work out which kind it is ---------- */

  function openSheet(file){
    hideFrom('stepCols');
    S.sheetId = file.id;
    S.excel = !!file.excel;
    S.posted = {};
    S.existing = {};
    S.current = null;
    clearSay();
    say('', 'Reading the sheet...');

    var qs = 'sheetId=' + encodeURIComponent(file.id) +
             '&courier=' + encodeURIComponent(S.courier) +
             (S.excel ? '&excel=1' : '');

    // a summary block wins, since only some couriers write one
    get('/api/charges/summary-open?' + qs).then(function(d){
      if(d.cprs && d.cprs.length){
        clearSay();
        S.mode = 'summary';
        S.tab = d.tab;
        S.cprs = d.cprs;
        S.names = d.names || [];
        S.lines = (d.lines && d.lines.length) ? d.lines : defaultLines();
        if(d.lines && d.lines.length) showCprs();
        else showLines();
        return null;
      }
      return get('/api/charges/open?' + qs);
    }).then(function(d){
      if(!d) return;
      clearSay();
      S.mode = 'columns';
      soakColumns(d);
      if(d.remembered && d.cols.charges >= 0) showCprs();
      else showCols();
    }).catch(function(e){
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  }

  function soakColumns(d){
    S.tab = d.tab;
    S.header = d.header;
    S.cols = d.cols;
    S.cprs = (d.cprs || []).map(function(c){
      return {
        cpr: c.cprNumber, key: c.key, cprDate: c.cprDate, rows: c.rows,
        charges: c.charges, wht: c.wht, wst: c.wst, total: c.total
      };
    });
    S.skipped = d.skippedTotals || 0;
    if(d.accounts) S.accounts = d.accounts;
  }

  /* ---------- columns, for PostEx and its kind ---------- */

  var FIELDS = [
    ['cpr',      'CPR number'],
    ['cprDate',  'CPR date'],
    ['charges',  'Delivery charges'],
       ['charges2', 'Plus this column'],
    ['charges3', 'And this one'],
    ['wht',      'Withholding income tax'],
    ['wst',      'Withholding sales tax']
  ];

  function showCols(){
    hideFrom('stepCols');
    $('stepCols').classList.remove('hide');
    $('colsHint').textContent = S.header.length + ' columns found in "' + S.tab +
      '". Check these are right - they will be remembered for ' + S.courier + '.';

    var box = $('colsBox');
    box.innerHTML = '';
    FIELDS.forEach(function(f){
      var wrap = document.createElement('div');
      var lab = document.createElement('label');
      lab.textContent = f[1];
      var sel = document.createElement('select');
      sel.id = 'col_' + f[0];

      var none = document.createElement('option');
      none.value = '-1';
      none.textContent = '- none -';
      sel.appendChild(none);

      S.header.forEach(function(h, i){
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = (h || '(column ' + (i + 1) + ')');
        sel.appendChild(o);
      });

      sel.value = String(S.cols[f[0]] === undefined ? -1 : S.cols[f[0]]);
      wrap.appendChild(lab);
      wrap.appendChild(sel);
      box.appendChild(wrap);
    });
  }

  $('btnCols').addEventListener('click', function(){
    var cols = {};
    FIELDS.forEach(function(f){ cols[f[0]] = Number($('col_' + f[0]).value); });

       if(cols.charges < 0 && cols.charges2 < 0 && cols.charges3 < 0 &&
       cols.wht < 0 && cols.wst < 0){
      return say('bad', '<b>Pick at least one of the charge columns.</b>');
    }

    clearSay();
    $('btnCols').disabled = true;

    post('/api/charges/columns', { courier: S.courier, cols: cols }).then(function(){
      return get('/api/charges/open?sheetId=' + encodeURIComponent(S.sheetId) +
                 '&courier=' + encodeURIComponent(S.courier) +
                 '&tab=' + encodeURIComponent(S.tab) +
                 (S.excel ? '&excel=1' : ''));
    }).then(function(d){
      $('btnCols').disabled = false;
      $('stepCols').classList.add('done');
      soakColumns(d);
      showCprs();
    }).catch(function(e){
      $('btnCols').disabled = false;
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  });

  /* ---------- lines, for Trax and its kind ---------- */

  function defaultLines(){
    var pick = function(words){
      return S.names.filter(function(n){
        if(n.rollup) return false;
        var s = n.name.toLowerCase();
        return words.some(function(w){ return s.indexOf(w) >= 0; });
      }).map(function(n){ return n.name; });
    };

    var wht = pick(['wht', 'withholding']);
    var sst = pick(['sst', 'sales tax', 'sale tax']);
    var taken = wht.concat(sst).map(function(x){ return x.toLowerCase(); });

    var rest = S.names.filter(function(n){
      return !n.rollup && taken.indexOf(n.name.toLowerCase()) < 0;
    }).map(function(n){ return n.name; });

        // an adjustment is stated the other way round, so it comes off by default
    var signed = function(names){
      return names.map(function(n){
        return { name: n, sign: /adjust/i.test(n) ? -1 : 1 };
      });
    };

    return [
      { label: 'Delivery charges',       charges: signed(rest), account: '' },
      { label: 'Withholding income tax', charges: signed(wht),  account: '' },
      { label: 'Withholding sales tax',  charges: signed(sst),  account: '' }
    ];
  }

  function showLines(){
    hideFrom('stepLines');
    $('stepLines').classList.remove('hide');
    $('linesHint').innerHTML =
      'This sheet writes its charges in a summary block beside each CPR, not in columns. ' +
      'Say which charges go on which line of the journal entry - this is remembered for <b>' +
      esc(S.courier) + '</b>.<br>Charges that do not appear in a particular CPR are simply ' +
      'left out of that entry.';
    drawLines();
  }

  function drawLines(){
    var box = $('lineSet');
    box.innerHTML = '';

    S.lines.forEach(function(l, i){
      var row = document.createElement('div');
      row.className = 'lineRow';

            var chips = S.names.map(function(n){
        var picked = (l.charges || []).filter(function(c){
          return chargeName(c).toLowerCase() === n.name.toLowerCase();
        })[0];
        var on = !!picked;
        var minus = picked && picked.sign === -1;

        return '<label class="' + (on ? 'on' : '') + (n.rollup ? ' roll' : '') +
               (minus ? ' minus' : '') + '">' +
               '<input type="checkbox" data-line="' + i + '" data-name="' + esc(n.name) + '"' +
               (on ? ' checked' : '') + '>' + esc(n.name) +
               (on ? '<button class="flip" data-flip="' + i + '" ' +
                     'data-name="' + esc(n.name) + '" title="add or subtract">' +
                     (minus ? '\u2212' : '+') + '</button>' : '') +
               (n.rollup ? ' <span style="font-size:10px">(a sum of others)</span>' : '') +
               '</label>';
      }).join('');

      row.innerHTML =
        '<div class="top">' +
          '<div><label>Line name</label>' +
            '<input class="lname" data-line="' + i + '" value="' + esc(l.label || '') + '"></div>' +
          '<div><label>QuickBooks account</label>' +
            accountFinder('ln_' + i, l.account) + '</div>' +
          '<button class="drop" data-drop="' + i + '">Remove</button>' +
        '</div>' +
        '<label style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;' +
          'color:var(--faint);margin-bottom:6px;display:block">Charges on this line</label>' +
        '<div class="chargeGrid">' + chips + '</div>';

      box.appendChild(row);
    });

      box.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var i = Number(cb.getAttribute('data-line'));
        var name = cb.getAttribute('data-name');
        var l = S.lines[i];
        l.charges = l.charges || [];

        if(cb.checked){
          if(!l.charges.some(function(c){
            return chargeName(c).toLowerCase() === name.toLowerCase();
          })){
            // adjustments run the other way round, so they start as a subtraction
            var sign = /adjust/i.test(name) ? -1 : 1;
            l.charges.push({ name: name, sign: sign });
          }
        } else {
          l.charges = l.charges.filter(function(c){
            return chargeName(c).toLowerCase() !== name.toLowerCase();
          });
        }
        drawLines();
      });
    });

    box.querySelectorAll('button[data-flip]').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var i = Number(b.getAttribute('data-flip'));
        var name = b.getAttribute('data-name');
        var hit = (S.lines[i].charges || []).filter(function(c){
          return chargeName(c).toLowerCase() === name.toLowerCase();
        })[0];
        if(!hit) return;
        if(typeof hit === 'string'){
          var at = S.lines[i].charges.indexOf(hit);
          S.lines[i].charges[at] = { name: hit, sign: -1 };
        } else {
          hit.sign = hit.sign === -1 ? 1 : -1;
        }
        drawLines();
      });
    });

    box.querySelectorAll('input.lname').forEach(function(inp){
      inp.addEventListener('input', function(){
        S.lines[Number(inp.getAttribute('data-line'))].label = inp.value;
      });
    });

    box.querySelectorAll('button[data-drop]').forEach(function(b){
      b.addEventListener('click', function(){
        S.lines.splice(Number(b.getAttribute('data-drop')), 1);
        drawLines();
      });
    });

    bindFinders(S.lines.map(function(_, i){ return 'ln_' + i; }), function(id, accId){
      S.lines[Number(id.split('_')[1])].account = accId;
    });
  }

  $('btnAddLine').addEventListener('click', function(){
    S.lines.push({ label: '', charges: [], account: '' });
    drawLines();
  });

  $('btnLines').addEventListener('click', function(){
    var good = S.lines.filter(function(l){
      return String(l.label || '').trim() && (l.charges || []).length;
    });
    if(!good.length) return say('bad', '<b>Give at least one line a name and some charges.</b>');

    clearSay();
    $('btnLines').disabled = true;

    post('/api/charges/lines', { courier: S.courier, lines: S.lines }).then(function(){
      $('btnLines').disabled = false;
      $('stepLines').classList.add('done');
      showCprs();
    }).catch(function(e){
      $('btnLines').disabled = false;
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  });

  /* ---------- account finder, shared ---------- */

  function accountFinder(id, chosen){
    var hit = S.qbAccounts.filter(function(a){ return String(a.id) === String(chosen); })[0];
    return '<input class="accfind" id="' + id + '_find" list="acclist" ' +
             'placeholder="type to find an account" value="' + esc(hit ? hit.name : '') + '">' +
           '<input type="hidden" id="' + id + '" value="' + esc(chosen || '') + '">';
  }

  function bindFinders(ids, onPick){
    ensureList();
    ids.forEach(function(id){
      var box = $(id + '_find');
      if(!box) return;
      box.addEventListener('input', function(){
        var name = box.value.trim().toLowerCase();
        var hit = S.qbAccounts.filter(function(a){
          return a.name.toLowerCase() === name;
        })[0];
        $(id).value = hit ? hit.id : '';
        box.style.borderColor = hit ? '' : 'var(--warn)';
        if(onPick) onPick(id, hit ? hit.id : '');
      });
    });
  }

  function ensureList(){
    if($('acclist')) return;
    var dl = document.createElement('datalist');
    dl.id = 'acclist';
    dl.innerHTML = S.qbAccounts.map(function(a){
      return '<option value="' + esc(a.name) + '">' + esc(a.type) + '</option>';
    }).join('');
    document.body.appendChild(dl);
  }

  /* ---------- the CPR list ---------- */

  function liveCprs(){
    if(S.mode === 'summary') return S.cprs;
    return S.cprs.filter(function(c){
      return c.total > 0 && (c.cpr || c.rows >= 5);
    });
  }

  function showCprs(){
    hideFrom('stepCpr');
    $('stepCpr').classList.remove('hide');
    drawColNow();

    var list = liveCprs();
    $('cprHint').innerHTML = nf(list.length) + ' CPRs found.' +
      (S.skipped ? ' ' + nf(S.skipped) + ' total lines were ignored - the rows are added up here instead.' : '');

    drawCprs();
    scanAll();
  }

  function scanAll(){
    var list = liveCprs().map(function(c){
      return { cpr: c.cpr || c.key, total: cprTotal(c) };
    });
    if(!list.length) return;

    S.scanning = true;
    drawCprs();

    post('/api/charges/scan', { cprs: list }).then(function(d){
      S.scanning = false;
      S.existing = {};
      Object.keys(d.cprs || {}).forEach(function(k){
        if(d.cprs[k].state === 'none') return;
        S.existing[k] = d.cprs[k];
      });
      drawCprs();
      updateHint();
    }).catch(function(){
      S.scanning = false;
      drawCprs();
    });
  }

  // in summary mode the total depends on the lines, so work it out here
  function cprTotal(c){
    if(S.mode === 'columns') return c.total;
    var sum = 0;
     var wanted = {};
    S.lines.forEach(function(l){
      (l.charges || []).forEach(function(n){
        wanted[chargeName(n).toLowerCase()] = (typeof n === 'string') ? 1 : (n.sign || 1);
      });
    });
    (c.charges || []).forEach(function(ch){
      var sign = wanted[ch.name.toLowerCase()];
      if(sign) sum += ch.amount * sign;
    });
    return Math.round(sum * 100) / 100;
  }

  function updateHint(){
    var list = liveCprs();
    var done = 0, off = 0;
    list.forEach(function(c){
      var e = S.existing[c.cpr || c.key];
      if(!e) return;
      if(e.state === 'off') off++; else done++;
    });

    $('cprHint').innerHTML =
      nf(list.length) + ' CPRs \u00b7 ' +
      '<span style="color:var(--ok)">' + nf(done) + ' already posted and matching</span> \u00b7 ' +
      '<span style="color:var(--warn)">' + nf(off) + ' posted but the amount differs</span> \u00b7 ' +
      nf(list.length - done - off) + ' not posted yet';
  }

  function drawColNow(){
    var box = $('colNow');

    if(S.mode === 'summary'){
      var bits = S.lines.filter(function(l){ return (l.charges || []).length; })
        .map(function(l){
          return '<b>' + esc(l.label || 'unnamed') + '</b> \u2190 ' +
                 nf((l.charges || []).length) + ' charges';
        });
      box.innerHTML = 'Building &nbsp;' + bits.join(' &nbsp;\u00b7&nbsp; ') +
        '<a href="#" id="editCols">change</a>';
      $('editCols').addEventListener('click', function(e){
        e.preventDefault();
        showLines();
        $('stepLines').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return;
    }

    var parts = FIELDS.map(function(f){
      var i = S.cols[f[0]];
      var name = (i >= 0 && S.header[i]) ? S.header[i] : null;
      return f[1] + ': ' + (name
        ? '<b>' + esc(name) + '</b>'
        : '<span class="miss">not used</span>');
    });

    box.innerHTML = 'Reading from &nbsp;' + parts.join(' &nbsp;\u00b7&nbsp; ') +
      '<a href="#" id="editCols">change</a>';

    $('editCols').addEventListener('click', function(e){
      e.preventDefault();
      showCols();
      $('stepCols').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function drawCprs(){
    var box = $('cprList');
    box.innerHTML = '';

    var list = liveCprs();
    if(!list.length){
      box.innerHTML = '<span style="font-size:13px;color:var(--muted)">Nothing found.</span>';
      return;
    }

    list.forEach(function(c){
      var key = c.cpr || c.key;
      var e = S.existing[key];
      var state = e ? e.state : (S.posted[key] ? 'done' : 'none');
      var total = cprTotal(c);

      var card = document.createElement('div');
      card.className = 'cprCard' +
        (state === 'done' ? ' done' : '') +
        (state === 'off' ? ' off' : '') +
        (S.current && (S.current.cpr || S.current.key) === key ? ' on' : '');

      var mark = state === 'done' ? '<span class="tick">\u2713</span>'
               : state === 'off'  ? '<span class="warnmark">!</span>' : '';

      var note = '';
      if(S.scanning) note = '<br>checking QuickBooks...';
      else if(state === 'off') note = '<br><span style="color:#8A6100">QuickBooks has ' +
        money(e.amount) + ', this sheet says ' + money(e.sheetTotal) + '</span>';
      else if(state === 'done' && e) note = '<br>posted on ' + esc(e.date);

      card.innerHTML =
        '<div class="head"><b>' + mark + esc(key) + '</b><small>' +
        (c.cprDate ? esc(c.cprDate) + ' \u00b7 ' : '') +
        (c.rows ? nf(c.rows) + ' rows \u00b7 ' : '') + money(total) + note +
        '</small></div>';

      card.addEventListener('click', function(){
        S.current = c;
        drawCprs();
        openEntry(c);
      });

      box.appendChild(card);
    });
  }

  /* ---------- the entry ---------- */

  function openEntry(c){
    hideFrom('stepEntry');
    clearSay();
    $('postOut').innerHTML = '';
    $('warnBox').innerHTML = '';
    $('stepEntry').classList.remove('hide');

    var key = c.cpr || c.key;
    $('entryHint').innerHTML =
      'CPR <b>' + esc(key) + '</b>' +
      (c.cprDate ? ' dated <b>' + esc(c.cprDate) + '</b>' : ' - no date found in the sheet') +
      (c.rows ? ' \u00b7 added up from ' + nf(c.rows) + ' rows.' : '');

    var e = S.existing[key];
    if(e){
      $('warnBox').innerHTML =
        '<div class="result warn">This CPR is already in QuickBooks as journal entry ' +
        esc(e.id) + (e.date ? ', dated ' + esc(e.date) : '') + ', ' + money(e.amount) + '.' +
        (e.state === 'off'
          ? ' That is ' + money(Math.abs(e.gap)) + ' ' + (e.gap > 0 ? 'more' : 'less') +
            ' than this sheet adds up to.'
          : ' Posting again would double it.') +
        '</div>';
    }

    if(S.mode === 'summary') drawSummaryEntry(c);
    else drawColumnEntry(c);
  }

  function metaFields(c){
    var who = [(c.cpr || c.key), S.courier].filter(Boolean).join(' - ');
    return '<div style="padding:14px;border-top:1px solid var(--line)">' +
      '<label style="display:block;font-size:11px;letter-spacing:.07em;' +
        'text-transform:uppercase;color:var(--faint);margin-bottom:4px">' +
        'Description on every line</label>' +
      '<input id="jDesc" value="' + esc(who) + '" style="margin-bottom:14px">' +
      '<label style="display:block;font-size:11px;letter-spacing:.07em;' +
        'text-transform:uppercase;color:var(--faint);margin-bottom:4px">Memo</label>' +
      '<input id="jMemo" value="' + esc('Delivery charges - Withholding income , sale tax - ' + who) + '">' +
      '</div>';
  }

  // --- Trax and its kind ---
  function drawSummaryEntry(c){
    post('/api/charges/preview', { cpr: c, lines: S.lines }).then(function(p){
      S.preview = p;

      var rows = p.lines.map(function(l, i){
               var made = l.found.length
          ? l.found.map(function(f){
              return (typeof f === 'string' ? f : (f.sign === -1 ? '\u2212 ' : '+ ') + f.name);
            }).join(' ')
          : '<span style="color:var(--warn)">none of these charges are in this CPR</span>';
        return '<tr><td>' + esc(l.label || 'unnamed') +
               '<span class="made">' + made + '</span></td>' +
               '<td>' + accountFinder('pa_' + i, l.account) + '</td>' +
               '<td class="num"><input class="amt" id="pv_' + i + '" value="' +
                 l.amount.toFixed(2) + '"></td>' +
               '<td class="num" style="color:var(--muted)">Debit</td></tr>';
      }).join('');

      var bankRow = '<tr><td>Bank for ' + esc(S.courier) + '</td>' +
        '<td>' + accountFinder('pa_bank', (S.accounts || {}).bankAccount) + '</td>' +
        '<td class="num" id="creditCell">' + money(p.total) + '</td>' +
        '<td class="num" style="color:var(--muted)">Credit</td></tr>';

      var totRow = '<tr class="tot"><td colspan="2">Total</td>' +
        '<td class="num" id="totCell">' + money(p.total) + '</td><td></td></tr>';

      $('entryBox').innerHTML =
        '<table><thead><tr><th>Line</th><th>Account</th>' +
        '<th class="num">Amount</th><th class="num">Side</th></tr></thead>' +
        '<tbody>' + rows + bankRow + totRow + '</tbody></table>' +
        metaFields(c);

      p.lines.forEach(function(_, i){
        $('pv_' + i).addEventListener('input', retotalSummary);
      });

      bindFinders(p.lines.map(function(_, i){ return 'pa_' + i; }).concat(['pa_bank']));

      if(p.unused && p.unused.length){
        $('warnBox').innerHTML +=
          '<div class="result warn">' + nf(p.unused.length) + ' charge' +
          (p.unused.length === 1 ? '' : 's') + ' in this CPR are on no line, so they are ' +
          'left out: ' + p.unused.map(function(u){
            return esc(u.name) + ' (' + money(u.amount) + ')';
          }).join(', ') + '. <a href="#" id="fixLines">add them to a line</a></div>';

        var fix = $('fixLines');
        if(fix) fix.addEventListener('click', function(ev){
          ev.preventDefault();
          showLines();
          $('stepLines').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }
    }).catch(function(e){
      say('bad', '<b>' + esc(e.message) + '</b>');
    });
  }

  function retotalSummary(){
    var t = 0;
    (S.preview.lines || []).forEach(function(_, i){ t += amt('pv_' + i); });
    t = Math.round(t * 100) / 100;
    $('creditCell').textContent = money(t);
    $('totCell').textContent = money(t);
  }

  // --- PostEx and its kind ---
  function drawColumnEntry(c){
    var a = S.accounts || {};
    var rows = '';

    rows += '<tr><td>Delivery charges</td>' +
      '<td>' + accountFinder('acc_charges', a.chargesAccount) + '</td>' +
      '<td class="num"><input class="amt" id="amt_charges" value="' + c.charges.toFixed(2) + '"></td>' +
      '<td class="num" style="color:var(--muted)">Debit</td></tr>';

    rows += '<tr><td>Withholding income tax</td>' +
      '<td>' + accountFinder('acc_wht', a.whtAccount) + '</td>' +
      '<td class="num"><input class="amt" id="amt_wht" value="' + c.wht.toFixed(2) + '"></td>' +
      '<td class="num" style="color:var(--muted)">Debit</td></tr>';

    rows += '<tr><td>Withholding sales tax</td>' +
      '<td>' + accountFinder('acc_wst', a.wstAccount) + '</td>' +
      '<td class="num"><input class="amt" id="amt_wst" value="' + c.wst.toFixed(2) + '"></td>' +
      '<td class="num" style="color:var(--muted)">Debit</td></tr>';

    rows += '<tr><td>Bank for ' + esc(S.courier) + '</td>' +
      '<td>' + accountFinder('acc_bank', a.bankAccount) + '</td>' +
      '<td class="num" id="creditCell">' + money(c.total) + '</td>' +
      '<td class="num" style="color:var(--muted)">Credit</td></tr>';

    rows += '<tr class="tot"><td colspan="2">Total</td>' +
      '<td class="num" id="totCell">' + money(c.total) + '</td><td></td></tr>';

    $('entryBox').innerHTML =
      '<table><thead><tr><th>Line</th><th>Account</th>' +
      '<th class="num">Amount</th><th class="num">Side</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' + metaFields(c);

    ['amt_charges','amt_wht','amt_wst'].forEach(function(id){
      $(id).addEventListener('input', retotalColumns);
    });
    bindFinders(['acc_charges','acc_wht','acc_wst','acc_bank']);
  }

  function amt(id){
    var el = $(id);
    if(!el) return 0;
    var v = Number(String(el.value).replace(/[^0-9.\-]/g, ''));
    return isNaN(v) ? 0 : Math.round(v * 100) / 100;
  }

  function retotalColumns(){
    var t = amt('amt_charges') + amt('amt_wht') + amt('amt_wst');
    t = Math.round(t * 100) / 100;
    $('creditCell').textContent = money(t);
    $('totCell').textContent = money(t);
  }

  /* ---------- posting ---------- */

  $('btnPost').addEventListener('click', function(){
    var c = S.current;
    if(!c) return;
    var key = c.cpr || c.key;

    var body = {
      courier: S.courier,
      cprNumber: key,
      cprDate: c.cprDate,
      description: $('jDesc') ? $('jDesc').value : '',
      memo: $('jMemo') ? $('jMemo').value : ''
    };

    var url, total;

    if(S.mode === 'summary'){
      body.bankAccount = $('pa_bank').value;
      body.lines = (S.preview.lines || []).map(function(l, i){
        return { label: l.label, account: $('pa_' + i).value, amount: amt('pv_' + i) };
      }).filter(function(l){ return l.amount > 0; });
      total = body.lines.reduce(function(s, l){ return s + l.amount; }, 0);
      url = '/api/charges/post-lines';
    } else {
      body.charges = amt('amt_charges');
      body.wht = amt('amt_wht');
      body.wst = amt('amt_wst');
      body.chargesAccount = $('acc_charges').value;
      body.whtAccount = $('acc_wht').value;
      body.wstAccount = $('acc_wst').value;
      body.bankAccount = $('acc_bank').value;
      total = body.charges + body.wht + body.wst;
      url = '/api/charges/post';
    }

    total = Math.round(total * 100) / 100;
    if(total <= 0) return say('bad', '<b>Everything came to zero.</b>');
    if(!body.bankAccount) return say('bad', '<b>Pick the bank account.</b>');

    var msg = 'Post ' + money(total) + ' for CPR ' + key + '?' +
              (c.cprDate ? '\nDated ' + c.cprDate : '\nNo date found - QuickBooks will use today.');
    if(S.existing[key]) msg += '\n\nThis CPR is already in QuickBooks. Posting again will double it.';
    if(!confirm(msg)) return;

    if(S.existing[key]) body.force = true;

    clearSay();
    $('btnPost').disabled = true;
    $('postOut').innerHTML = '<div class="result">Posting...</div>';

    post(url, body).then(function(d){
      $('btnPost').disabled = false;
      S.posted[key] = d.id;
      S.existing[key] = { state: 'done', id: d.id, date: c.cprDate, amount: d.total };
      drawCprs();
      updateHint();
      $('postOut').innerHTML =
        '<div class="result good">\u2713 Journal entry ' + esc(d.id) + ' posted \u00b7 ' +
        money(d.total) + ' for CPR ' + esc(d.cprNumber) + '</div>';

      if(S.mode === 'columns'){
        S.accounts = {
          chargesAccount: body.chargesAccount,
          whtAccount: body.whtAccount,
          wstAccount: body.wstAccount,
          bankAccount: body.bankAccount
        };
      } else {
        S.accounts = S.accounts || {};
        S.accounts.bankAccount = body.bankAccount;
        S.lines.forEach(function(l, i){
          var picked = $('pa_' + i);
          if(picked && picked.value) l.account = picked.value;
        });
        post('/api/charges/lines', { courier: S.courier, lines: S.lines }).catch(function(){});
      }
    }).catch(function(e){
      $('btnPost').disabled = false;
      $('postOut').innerHTML = '<div class="result bad">\u2717 ' + esc(e.message) + '</div>';
    });
  });
})();
</script>
</body>
</html>
