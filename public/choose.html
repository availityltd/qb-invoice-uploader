<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your company</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F2E24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  /* One thing on the screen, so it sits in the middle of it. The shape is the one
     QuickBooks uses for the same question, because it is the same question. */
  .pick{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:30px 28px 24px;box-shadow:0 10px 34px rgba(15,46,36,.07)}
  .card img{width:52px;height:52px;border-radius:12px;display:block;margin:0 auto 18px}
  .card h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 4px}
  .card .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
  .find{width:100%;padding:10px 13px;border:1px solid var(--line-2);border-radius:9px;
    font:inherit;font-size:14px;margin-bottom:14px}
  .find:focus{outline:none;border-color:var(--qbo)}
  .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:0 0 9px}
  .co{width:100%;text-align:left;display:block;background:var(--panel);cursor:pointer;
    border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;
    font:inherit;color:var(--text)}
  .co:hover{border-color:var(--qbo);background:var(--panel-2)}
  .co b{display:block;font-size:14.5px;font-weight:600}
  .co span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:2px}
  .co.cur{border-color:var(--qbo)}
  .note{color:var(--muted);font-size:12px;line-height:1.6;margin:16px 0 0;text-align:center}
  .note a{color:var(--qbo)}
  .empty{color:var(--muted);font-size:13.5px;line-height:1.65;text-align:center;padding:6px 0 2px}
  .empty b{color:var(--text);font-weight:600}
  .empty.no b{color:var(--neg)}

  /* The same three buttons every page of the app carries, because this is still
     a page and going back from it should not mean the browser's own chrome. */
  .tools{position:fixed;top:14px;left:16px;display:flex;gap:6px;z-index:5}
  .tools button{width:30px;height:30px;border:1px solid var(--line);background:#fff;
    border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:var(--muted);padding:0}
  .tools button:hover{border-color:var(--qbo);color:var(--qbo)}
  .tools button svg{width:15px;height:15px}
  .out{display:block;width:100%;margin-top:14px;padding:9px;border-radius:8px;
    border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;
    color:var(--muted);cursor:pointer}
  .out:hover{border-color:var(--neg);color:var(--neg)}
  .go{display:block;width:100%;margin-top:14px;padding:10px;border-radius:8px;border:0;
    background:var(--qbo);color:#fff;font:inherit;font-size:13px;font-weight:600;
    cursor:pointer}
  .go:hover{filter:brightness(1.06)}
  .go:disabled{opacity:.7;cursor:default}
  .pulse{color:var(--qbo);animation:fade 1.6s ease-in-out infinite}
  @keyframes fade{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>

<div class="tools">
  <button id="tBack" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="tFwd" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="tRef" title="Refresh this page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg></button>
</div>

<div class="pick">
  <div class="card">
    <img src="/logo.svg" alt="">
    <h1 id="head">Choose your company</h1>
    <p class="sub" id="sub">&nbsp;</p>

    <input class="find" id="find" type="search" placeholder="Search…" style="display:none">
    <p class="cap" id="cap" style="display:none">QuickBooks companies</p>
    <div id="list"><div class="empty">Loading…</div></div>

    <p class="note" id="note"></p>
    <button class="go" id="btnAsk" style="display:none">Ask the admin again</button>
    <button class="out" id="btnStop" style="display:none">Cancel waiting</button>
    <button class="out" id="btnOut" style="display:none">Cancel and sign out</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var all = [], current = null, waitTimer = null;

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function draw(){
    var q = ($('find').value || '').trim().toLowerCase();
    var show = all.filter(function(c){
      return !q || c.name.toLowerCase().indexOf(q) > -1 || String(c.realmId).indexOf(q) > -1;
    });

    if(!show.length){
      $('list').innerHTML = '<div class="empty">No company by that name.</div>';
      return;
    }

    $('list').innerHTML = show.map(function(c){
      return '<button class="co' + (c.realmId === current ? ' cur' : '') +
             '" data-id="' + esc(c.realmId) + '">' +
             '<b>' + esc(c.name) + '</b><span>' + esc(c.realmId) + '</span></button>';
    }).join('');

    Array.prototype.forEach.call($('list').querySelectorAll('.co'), function(b){
      b.addEventListener('click', function(){
        b.disabled = true;
        b.querySelector('b').textContent = 'Opening…';
        fetch('/auth/switch', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ realmId: b.getAttribute('data-id') })
        })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.error) throw new Error(d.error);
          location.href = '/';
        })
        .catch(function(e){
          b.disabled = false;
          $('note').textContent = e.message;
        });
      });
    });
  }

  // Nobody has said yet whether this person may come in. They wait here rather
  // than at a page of the app they cannot use - and they wait without having to
  // do anything: the question is asked again every few seconds, so the moment the
  // admin says yes the screen moves on by itself.
  function waitForAdmin(who){
    $('head').textContent = 'Waiting to be let in';
    $('btnAsk').style.display = 'none';
    $('btnStop').style.display = '';
    $('btnStop').disabled = false;
    $('btnStop').textContent = 'Cancel waiting';
    $('sub').textContent = 'Nothing is open yet.';
    $('cap').style.display = 'none';
    $('find').style.display = 'none';
    $('btnOut').style.display = '';
    $('list').innerHTML =
      '<div class="empty"><b>Ask the admin to let you in.</b><br><br>' +
      'They have been told you are here' + (who ? ', as ' + esc(who) : '') + '. ' +
      'Once they have said which companies you work in, this page opens by ' +
      'itself - there is nothing to press.</div>';
    $('note').innerHTML = '<span class="pulse">Waiting…</span>';

    // often enough that nobody sits there wondering, seldom enough that a
    // screen left open all day is not a cost in itself
    if(!waitTimer) waitTimer = setInterval(look, 10000);
  }

  // Withdrawn - the admin is no longer being asked, and nothing is waiting on
  // anybody. Asking again is one press away whenever they want it.
  function withdrawn(){
    if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
    $('head').textContent = 'Not asking';
    $('sub').textContent = 'Nothing is waiting on anybody.';
    $('cap').style.display = 'none';
    $('find').style.display = 'none';
    $('btnStop').style.display = 'none';
    $('btnOut').style.display = '';
    $('btnAsk').style.display = '';
    $('btnAsk').disabled = false;
    $('btnAsk').textContent = 'Ask the admin to let me in';
    $('list').innerHTML =
      '<div class="empty"><b>You have withdrawn.</b><br><br>' +
      'The admin is not being asked to let you in. Ask again below whenever ' +
      'you want to.</div>';
    $('note').textContent = '';
  }

  // The admin has decided, and the answer was no. Said plainly, and said once -
  // there is nothing to wait for, so the asking stops.
  function turnedAway(){
    if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
    $('head').textContent = 'Not let in';
    $('btnStop').style.display = 'none';
    $('sub').textContent = 'The admin has answered.';
    $('cap').style.display = 'none';
    $('find').style.display = 'none';
    $('btnOut').style.display = '';
    $('btnAsk').style.display = '';
    $('btnAsk').disabled = false;
    $('btnAsk').textContent = 'Ask the admin again';
    $('list').innerHTML =
      '<div class="empty no"><b>Your access has been turned down.</b><br><br>' +
      'The admin has not given you access to this app. Ask them again below, or ' +
      'speak to them - they can turn it on at any time.</div>';
    $('note').textContent = '';
  }

  function chooser(){
    $('head').textContent = 'Choose your company';
    $('btnAsk').style.display = 'none';
    $('btnStop').style.display = 'none';
  }

  function look(){
    fetch('/auth/status', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(st){
        if(!st.signedIn){ location.href = '/'; return; }
        if(!st.letIn && st.decided) return turnedAway();
        if(!st.letIn && !st.asking) return withdrawn();
        if(!st.letIn || !st.companyCount) return waitForAdmin(st.user);

        if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
        return offer();
      })
      .catch(function(){});
  }

  function offer(){
  return fetch('/auth/companies', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      all = d.companies || [];
      current = d.current || null;
      chooser();

      // One company is not a choice. They are put into it and the app opens.
      if(all.length === 1 && !d.admin){
        $('sub').textContent = 'Opening ' + all[0].name + '…';
        $('cap').style.display = 'none';
        $('list').innerHTML = '<div class="empty">One moment.</div>';
        return fetch('/auth/switch', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ realmId: all[0].realmId })
        }).then(function(){ location.replace('/'); });
      }

      if(!all.length){
        $('sub').textContent = d.admin ? 'Nothing is connected yet.' : 'Nothing yet.';
        $('list').innerHTML = '<div class="empty">' + (d.admin
          ? 'The app works through a company file, connected once. Connect one to ' +
            'begin.'
          : 'No company has been given to you yet. The admin says who works in ' +
            'which company, on the Manage users page.') + '</div>';
        if(d.admin){
          $('note').innerHTML = '<a href="/auth/connect">Connect a QuickBooks company</a>';
        }
        return;
      }

      $('sub').textContent = 'Everything you see in the app comes from the one you pick.';
      $('cap').style.display = '';
      if(all.length > 6) $('find').style.display = '';
      $('find').addEventListener('input', draw);
      draw();

      $('btnOut').style.display = '';
      $('note').innerHTML = 'You can change company later from the name at the ' +
        'bottom of the rail.' + (d.admin
          ? ' <a href="/auth/connect">Connect another company</a>' : '');
    })
    .catch(function(){
      $('list').innerHTML = '<div class="empty">Could not reach the server.</div>';
    });
  }

  $('tBack').addEventListener('click', function(){ history.back(); });
  $('tFwd').addEventListener('click', function(){ history.forward(); });
  $('tRef').addEventListener('click', function(){ location.reload(); });

  // Asking again does not let them in. It rubs out the answer, so the address is
  // back on the admin's list as one nobody has answered - and they are told.
  $('btnAsk').addEventListener('click', function(){
    var b = $('btnAsk');
    b.disabled = true;
    b.textContent = 'Asking…';

    fetch('/api/access/request', { method:'POST' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) throw new Error(d.error);
        waitForAdmin(null);
        $('list').innerHTML =
          '<div class="empty"><b>The admin has been asked.</b><br><br>' +
          'They have been told on their own screen. Once they answer, this page ' +
          'moves on by itself - there is nothing to press.</div>';
      })
      .catch(function(e){
        b.disabled = false;
        b.textContent = 'Ask the admin again';
        $('note').textContent = e.message;
      });
  });

  $('btnStop').addEventListener('click', function(){
    var b = $('btnStop');
    b.disabled = true;
    b.textContent = 'Cancelling…';

    fetch('/api/access/cancel', { method:'POST' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) throw new Error(d.error);
        withdrawn();
      })
      .catch(function(e){
        b.disabled = false;
        b.textContent = 'Cancel waiting';
        $('note').textContent = e.message;
      });
  });

  $('btnOut').addEventListener('click', function(){
    if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
    fetch('/auth/signout', { method:'POST' })
      .then(function(){ location.href = '/'; })
      .catch(function(){ location.href = '/'; });
  });

  look();

  // this page carries the update watcher too, like every other
  var s = document.createElement('script');
  s.src = '/update.js';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
