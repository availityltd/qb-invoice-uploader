<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBooks Invoice Uploader</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8; margin: 0; padding: 24px; color: #222;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 10px; padding: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 18px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c62828; }
  .dot.on { background: #2ca01c; }
  button {
    padding: 10px 18px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .primary { background: #2ca01c; color: #fff; }
  .blue { background: #0077c5; color: #fff; }
  .grey { background: #e0e0e0; color: #444; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=file], input[type=number] {
    width: 100%; padding: 9px; border: 1px solid #ccc;
    border-radius: 6px; margin-bottom: 12px;
  }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
  .bar-bg { background: #e8e8e8; border-radius: 6px; height: 20px; overflow: hidden; margin: 12px 0 6px; }
  .bar { height: 100%; width: 0; background: #2ca01c; transition: width .3s; }
  .stat { text-align: center; font-size: 13px; color: #555; margin-bottom: 12px; }
  #log {
    background: #1e1e1e; color: #ddd; border-radius: 6px; padding: 12px;
    height: 280px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px;
  }
  .ok { color: #6bd66b; } .err { color: #ff7b7b; } .warn { color: #ffc46b; } .info { color: #8ec9ff; }
  .hide { display: none; }
  .summary { background: #eef7ee; border-left: 4px solid #2ca01c; padding: 12px; border-radius: 5px; font-size: 14px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>QuickBooks Invoice Uploader</h1>
    <div class="sub">Upload an Excel file and create invoices directly in QuickBooks Online.</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking connection...</span>
    </div>
    <div style="margin-top:14px;">
      <button class="primary" id="btnConnect">Connect to QuickBooks</button>
      <button class="grey hide" id="btnDisconnect">Disconnect</button>
    </div>
  </div>

  <div class="card hide" id="uploadCard">
    <label>Excel file (.xlsx or .csv)</label>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">

    <div id="summary" class="summary hide"></div>

    <label>Delay between invoices (seconds)</label>
    <input type="number" id="delay" value="1.5" step="0.5" min="0.5">

    <label style="margin-bottom:14px;">
      <input type="checkbox" id="negDiscount"> Make discount lines negative
    </label>

    <button class="blue" id="btnUpload" disabled>Start Upload</button>

    <div class="bar-bg"><div class="bar" id="bar"></div></div>
    <div class="stat" id="stat">Ready</div>
    <div id="log"></div>
  </div>

</div>

<script>
let invoices = [];

const $ = id => document.getElementById(id);

function log(msg, cls = '') {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

async function checkStatus() {
  const r = await fetch('/auth/status');
  const s = await r.json();
  if (s.connected) {
    $('dot').classList.add('on');
    $('statusText').textContent = 'Connected: ' + (s.companyName || s.realmId);
    $('btnConnect').classList.add('hide');
    $('btnDisconnect').classList.remove('hide');
    $('uploadCard').classList.remove('hide');
  } else {
    $('dot').classList.remove('on');
    $('statusText').textContent = 'Not connected';
    $('btnConnect').classList.remove('hide');
    $('btnDisconnect').classList.add('hide');
    $('uploadCard').classList.add('hide');
  }
}

$('btnConnect').onclick = () => location.href = '/auth/connect';

$('btnDisconnect').onclick = async () => {
  await fetch('/auth/disconnect', { method: 'POST' });
  location.reload();
};

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;

  const fd = new FormData();
  fd.append('file', f);

  $('summary').classList.add('hide');
  $('btnUpload').disabled = true;

  try {
    const r = await fetch('/api/preview', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    invoices = d.invoices;
    $('summary').innerHTML =
      `<b>${d.count}</b> invoices &middot; <b>${d.totalLines}</b> lines<br>` +
      `Customer: ${d.customers.join(', ') || '(none)'}`;
    $('summary').classList.remove('hide');
    $('btnUpload').disabled = false;
    log(`File loaded: ${d.count} invoices, ${d.totalLines} lines.`, 'ok');
  } catch (err) {
    log('Error: ' + err.message, 'err');
  }
};

$('btnUpload').onclick = async () => {
  if (!invoices.length) return;

  $('log').innerHTML = '';
  $('btnUpload').disabled = true;
  $('bar').style.width = '0%';

  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      invoices,
      delay: (parseFloat($('delay').value) || 1.5) * 1000,
      negDiscount: $('negDiscount').checked
    })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const parts = buffer.split('\n\n');
    buffer = parts.pop();

    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const ev = JSON.parse(part.slice(6));

      if (ev.type === 'log')      log(ev.msg, 'info');
      else if (ev.type === 'ok')  log(`OK  ${ev.doc}  (QB Id ${ev.id})`, 'ok');
      else if (ev.type === 'retry') log(`retry ${ev.attempt}/5  ${ev.doc}  ${ev.msg}`, 'warn');
      else if (ev.type === 'fail') log(`FAILED  ${ev.doc}  ${ev.msg}`, 'err');
      else if (ev.type === 'error') log('ERROR: ' + ev.msg, 'err');
      else if (ev.type === 'progress') {
        const pct = Math.round((ev.current / ev.total) * 100);
        $('bar').style.width = pct + '%';
        $('stat').textContent = `${ev.done} done · ${ev.failed} failed · ${ev.total - ev.current} remaining`;
      }
      else if (ev.type === 'complete') {
        log(`--- Complete: ${ev.done} succeeded, ${ev.failed} failed ---`, ev.failed ? 'warn' : 'ok');
        $('btnUpload').disabled = false;
      }
    }
  }
};

checkStatus();
</script>
</body>
</html>
